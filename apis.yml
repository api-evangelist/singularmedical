name: Singular Medical
description: Singular Medical (Suzhou Singular Medical Equipment Co., Ltd. / 苏州无双医疗设备有限公司)
  is a Chinese medical-device company pioneering the domestic research, development, and
  manufacturing of cardiac rhythm management (CRM) products. It builds China's own implantable
  cardioverter defibrillators (ICD) and implantable cardiac monitors (ICM) — devices that
  automatically identify malignant arrhythmias, deliver anti-tachycardia pacing and defibrillation
  to prevent sudden cardiac death, and provide long-term subcutaneous ECG monitoring for the
  diagnosis of unexplained syncope, atrial fibrillation, and cryptogenic stroke, with cloud-based
  event transmission for remote clinical review. Backed by Qiming Venture Partners. This is a
  medical-device hardware manufacturer with a corporate marketing web presence and no public
  developer, API, or documentation program at this time.
